name: CI

on:
  push:
  pull_request:

# A force-push while CI is still running leaves the old run burning a runner on
# a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, tests, audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # node-version-file reads .nvmrc, which pins 24. If .nvmrc is ever
      # removed, replace this with `node-version: '20.x'` rather than letting
      # the runner's default float — the mongoose 5 / tus-node-server stack in
      # this repo is not tested against arbitrary Node majors.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Catches a file that parses on the author's machine but not on the CI
      # Node. Cheap, and it runs before the test suite so a syntax error is
      # reported as a syntax error rather than as 37 failing suites.
      - name: Syntax check every .js file
        run: |
          find . \
            \( -path ./node_modules -o -path ./coverage -o -path ./files \
               -o -path ./datastore -o -path ./docs -o -path ./.git \) -prune \
            -o -name '*.js' -print0 \
          | xargs -0 -r -n1 node --check

      # Thresholds live in jest.config.js (coverageThreshold). A drop below
      # them fails this step.
      #
      # ONE retry, and only for a known supertest transport flake. Roughly one
      # run in fifteen has a single test whose entire failure message is
      # "socket hang up": supertest binds an ephemeral server per request and
      # the connection to it is occasionally dropped before the response is
      # read. That is not this repository's code — it reproduces on master, and
      # a reviewer reproduced it again in a 25-line file containing none of
      # this repo at all. Measured here: 1 flaky run in 30 consecutive local
      # runs of the full suite.
      #
      # A blanket "retry twice" would also paper over a real intermittent bug,
      # so the retry is gated on the SHAPE of the failure, not on the fact that
      # something failed. The run is retried only when every failing test
      # failed with a transport error and there were at most MAX_FLAKY of them.
      # An assertion failure among them, a suite that failed to load, a
      # coverage-threshold failure, or a sudden pile of transport errors all
      # fail the build on the first attempt with no retry at all.
      #
      # WHAT THIS CAN STILL HIDE: a genuine intermittent fault in application
      # code whose symptom is also a dropped connection — a route that kills
      # the socket under a rare race would be indistinguishable from the flake
      # here. The retry is bounded at one and every retried run prints a
      # ::warning:: naming the tests it tolerated, so such a fault surfaces as
      # "this build needed a retry" rather than as silence. Read those warnings
      # before treating a green build as a clean one; a test that shows up in
      # them repeatedly is not the flake, it is a bug.
      - name: Unit tests with coverage
        run: |
          set -u

          run_suite() {
            set +e
            yarn test --coverage --ci --json --outputFile=jest-results.json
            suite_status=$?
            set -e
          }

          classify() {
            node - <<'NODE'
          const fs = require("fs");

          // At most this many transport failures may be tolerated in one run.
          // The observed flake is a single dropped connection; a run where a
          // dozen requests died is a symptom, not noise.
          const MAX_FLAKY = 2;

          // Bare transport errors from supertest's client/server pair. These
          // carry no assertion text — a real failed expectation never looks
          // like this.
          const TRANSPORT = [
            // Anchored to a whole line: jest renders this error either bare
            // or as "Error: socket hang up", and both are the entire first
            // line. An assertion message never is.
            /^(Error: )?socket hang up$/m,
            /\bECONNRESET\b/,
            /\bEPIPE\b/,
            /Client network socket disconnected/,
          ];

          let results;
          try {
            results = JSON.parse(fs.readFileSync("jest-results.json", "utf8"));
          } catch (err) {
            console.log(`No parseable jest results (${err.message}); not retrying.`);
            process.exit(1);
          }

          // A suite that could not even be loaded is a broken build, not a
          // dropped socket.
          if (results.numRuntimeErrorTestSuites > 0) {
            console.log("A suite failed to run; not retrying.");
            process.exit(1);
          }

          const failed = [];
          (results.testResults || []).forEach((suite) => {
            if (suite.testExecError) {
              failed.push({ name: suite.name, messages: ["<suite execution error>"] });
            }
            (suite.assertionResults || [])
              .filter((t) => t.status === "failed")
              .forEach((t) => {
                failed.push({ name: t.fullName, messages: t.failureMessages || [] });
              });
          });

          // Non-zero exit with nothing failing is the coverage ratchet (or a
          // jest error). Re-running does not change a coverage number.
          if (failed.length === 0) {
            console.log("The run failed with no failing test; not retrying.");
            process.exit(1);
          }

          if (failed.length > MAX_FLAKY) {
            console.log(
              `${failed.length} failing tests exceeds MAX_FLAKY=${MAX_FLAKY}; not retrying.`,
            );
            process.exit(1);
          }

          const isTransport = (f) =>
            f.messages.length > 0 &&
            f.messages.every((m) => TRANSPORT.some((re) => re.test(m)));

          const real = failed.filter((f) => !isTransport(f));
          if (real.length > 0) {
            real.forEach((f) => console.log(`Real failure: ${f.name}`));
            process.exit(1);
          }

          failed.forEach((f) => {
            console.log(
              `::warning::Tolerating a known supertest transport failure in "${f.name}" and retrying once.`,
            );
          });
          process.exit(0);
          NODE
          }

          run_suite

          if [ "$suite_status" -ne 0 ]; then
            set +e
            classify
            retryable=$?
            set -e

            if [ "$retryable" -ne 0 ]; then
              echo "::error::Test failures are not the known transport flake — not retrying."
              rm -f jest-results.json
              exit "$suite_status"
            fi

            run_suite
          fi

          rm -f jest-results.json
          exit "$suite_status"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      # THRESHOLD: fail on any CRITICAL advisory that has not been triaged.
      #
      # A plain "fail on critical" gate would red this build on its first run,
      # which is worth spelling out because it is easy to assume otherwise. As
      # of this workflow landing the tree reports 4 critical / 41 high / 67
      # moderate / 9 low across 310 audited packages — but those 4 criticals
      # are all the SAME advisory (1117404, mongoose search injection) counted
      # once per dependency path, and mongoose is a DIRECT dependency pinned at
      # ^5.13.23 whose fix is >=6.13.6: a major upgrade, not a patch bump. The
      # models in this repo use mongoose-5 APIs throughout (`execPopulate()`,
      # `useCreateIndex`), so it is a project, not a lockfile edit.
      #
      # So the gate is keyed on advisory ID rather than on severity alone: a
      # NEW critical fails the build immediately, while the one known, tracked,
      # cannot-be-patched finding is listed in TRIAGED below with its reason.
      # That keeps the signal real. A gate everybody has learned to ignore
      # protects nothing.
      #
      # NEXT RATCHET: high (currently 4 distinct advisories — mongoose 1118999,
      # nodemailer 1121191 and 1123478, path-to-regexp 1115527). path-to-regexp
      # is the cheap one: 0.1.12 -> 0.1.13 via a resolution or an express bump.
      # Once those are cleared, extend this step to fail on high as well.
      # nightly.yml already reports what that stricter gate would say, so the
      # remaining backlog is visible without blocking anyone.
      - name: Dependency audit
        run: |
          # yarn exits with a bitmask of the severities present
          # (1 info | 2 low | 4 moderate | 8 high | 16 critical) and has no
          # --audit-level, so the JSON stream is what gets inspected.
          set +e
          yarn audit --json --groups dependencies > audit.json
          audit_code=$?
          set -e

          echo "yarn audit exit code: ${audit_code}"

          node - <<'NODE'
          const fs = require("fs");

          // Advisories reviewed and accepted, by npm advisory id. An entry here
          // means "known, tracked, and not fixable by a version bump we can
          // take today" — never "noisy, make it go away". Remove an entry the
          // moment its fix is shipped.
          const TRIAGED = new Map([
            [
              1117404,
              "mongoose search injection. Installed 5.13.23; patched >=6.13.6, " +
                "a major upgrade — models/ depends on mongoose-5 APIs. Tracked as its own piece of work.",
            ],
          ]);

          const advisories = new Map();

          fs.readFileSync("audit.json", "utf8")
            .split("\n")
            .filter(Boolean)
            .forEach((line) => {
              let parsed;
              try {
                parsed = JSON.parse(line);
              } catch (err) {
                return; // Progress/summary lines are not advisories.
              }
              if (parsed.type !== "auditAdvisory") {
                return;
              }
              // yarn emits one line per dependency PATH, so the same advisory
              // arrives several times. Key by id to count findings, not paths.
              const advisory = parsed.data.advisory;
              advisories.set(advisory.id, advisory);
            });

          const bySeverity = (severity) =>
            [...advisories.values()].filter((a) => a.severity === severity);

          const criticals = bySeverity("critical");
          const highs = bySeverity("high");
          const untriaged = criticals.filter((a) => !TRIAGED.has(a.id));

          console.log(
            `Distinct advisories: ${criticals.length} critical, ${highs.length} high.`,
          );

          criticals
            .filter((a) => TRIAGED.has(a.id))
            .forEach((a) => {
              console.log(
                `::warning::Triaged critical ${a.id} (${a.module_name}): ${TRIAGED.get(a.id)}`,
              );
            });

          highs.forEach((a) => {
            console.log(
              `::warning::High ${a.id} (${a.module_name}, patched ${a.patched_versions}): ${a.title}`,
            );
          });

          if (untriaged.length > 0) {
            untriaged.forEach((a) => {
              console.log(
                `::error::Untriaged CRITICAL ${a.id} in ${a.module_name} ` +
                  `(installed ${a.findings?.[0]?.version || "?"}, patched ${a.patched_versions}): ${a.title}`,
              );
            });
            console.log(
              "Fix it, or add the advisory id to TRIAGED in .github/workflows/ci.yml with a reason.",
            );
            process.exit(1);
          }

          console.log("No untriaged critical advisories.");
          NODE

      - name: Remove audit artefact
        if: always()
        run: rm -f audit.json

      # This job used to be `yarn test --detectOpenHandles --runInBand`, which
      # is precisely the configuration in which the leak it exists to find is
      # invisible, and it was green for the entire life of one:
      #
      #   * --detectOpenHandles forces --runInBand (jest's own
      #     shouldRunInBand() returns true for it unconditionally), and
      #   * a leak announces itself as "A worker process has failed to exit
      #     gracefully" — which needs a worker. In band there is none.
      #
      # jest also runs in band whenever maxWorkers <= 1, which is what a
      # 2-vCPU GitHub runner computes, so simply dropping the flag would not
      # have been enough either. `--workerIdleMemoryLimit` is the one switch
      # that forces a forked worker regardless of worker count.
      #
      # One suite per invocation, so the leaking suite is always the last thing
      # its worker did and the timer is guaranteed to still be alive at
      # shutdown. Run together, whether a leak is noticed depends on which
      # suite happens to land last — measured at 8 detections in 10 runs with a
      # known 1s timer present, and 0 in 10 once other suites kept the worker
      # busy past it. Per suite it is 6 out of 6, and 0 out of 6 with the leak
      # fixed.
      #
      # Test FAILURES are deliberately not fatal here: correctness is the
      # `Unit tests with coverage` step's job, and letting the transport flake
      # redden this one would teach everybody to ignore it. Only a force-exit
      # fails this step.
      - name: Leaked handle detection
        run: |
          set -u
          leaked=""

          for suite in $(yarn --silent jest --listTests | sort); do
            log=$(mktemp)
            yarn test --ci --maxWorkers=2 --workerIdleMemoryLimit=512MB \
              --runTestsByPath "$suite" > "$log" 2>&1 || true

            if grep -q "failed to exit gracefully" "$log"; then
              leaked="${leaked}${suite}"$'\n'
              echo "::error::${suite} leaves a handle open: jest had to force-kill its worker."
            fi
            rm -f "$log"
          done

          if [ -n "$leaked" ]; then
            echo "Suites holding the event loop open after their last test:"
            printf '%s' "$leaked"
            echo "Re-run that suite with --detectOpenHandles --runInBand to see the handle."
            exit 1
          fi

          echo "No suite left a handle open."

  integration:
    # The name says PLACEHOLDER because that is what it is: __tests__/integration/
    # does not exist, so this job spins up mongo:6 and executes ZERO tests. It
    # was previously called "Integration tests (MongoDB)", which made a green
    # tick look like integration coverage — and it is the only job that could
    # ever catch the mongoose-5 migration gap, so mistaking it for coverage is
    # expensive. Rename it back the moment there is something here to run.
    name: Integration tests — PLACEHOLDER, runs zero tests
    # PR-only: these need a real mongod, and running them on every push to a
    # feature branch buys nothing the PR run does not already cover.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_PORT: 27017
      MONGO_URI: mongodb://localhost:27017/komondor-ci

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Two modes, so this job cannot quietly go on being green while claiming
      # to be a gate:
      #
      #   no __tests__/integration/  -> warn, loudly, that zero tests ran.
      #   __tests__/integration/     -> a real gate. --passWithNoTests is gone,
      #                                 so a directory that exists but matches
      #                                 nothing (wrong filename, wrong pattern)
      #                                 fails instead of passing — which is the
      #                                 exact failure that would otherwise let
      #                                 somebody believe in this job's tick.
      - name: Run integration tests
        run: |
          set -eu

          if [ ! -d __tests__/integration ]; then
            echo "::warning::__tests__/integration/ does not exist. This job started a MongoDB service and ran ZERO tests. Its green tick is NOT integration coverage — nothing here exercises the real mongoose driver."
            exit 0
          fi

          yarn test --testPathPattern "__tests__/integration/" --runInBand
