openapi: 3.1.0

info:
  title: komondor-api
  version: "1.0.0"
  summary: TSL Sequence Data API — projects, samples, sequencing runs and their files.
  description: |
    A description of what komondor-api **does today**, derived by reading
    `routes/` and `models/`. It is a record of current behaviour, not a
    proposal. Where the current behaviour is a known defect it is documented as
    it is, and the operation carries a `DRIFT` or `DEFECT` note saying so.
    Fixing one of those is a change to the API and must update this file in the
    same commit.

    `__tests__/contract/openapi.test.js` fails if a route exists in `routes/`
    with no entry here, so the two cannot silently diverge.

    ## Known drift from the sibling clients

    Three repositories consume this API: `komondor-web` (Nuxt 2 UI),
    `komondor-power` (bulk CSV ingest) and `komondor-nudge` (a scheduled
    worker that reads the same MongoDB directly rather than over HTTP). The
    following are the places where their assumptions and this server's
    behaviour have come apart. See `docs/CONTRACTS.md` for the policy.

    1. **Routes are mounted at the ROOT, not under `/api`.** `app.js` calls
       `app.use(authRoutes)` with no path prefix, so login is `POST /login`,
       not `POST /api/login` or `POST /auth/login`. The comment above the login
       handler in `routes/auth.js` still reads "Add POST - /api/login", which
       is where the belief came from. `komondor-power`'s client tries
       `${baseUrl}/auth/login` first and only falls back to `${baseUrl}/login`
       when that fails, so every one of its logins costs a wasted 404.

    2. **Bearer tokens must carry an `exp` claim.** A token without one is
       refused as expired, not accepted. See the `bearerAuth` scheme.

    3. **`Group.deleted` is a soft-delete flag**, not a removal. `GET /groups`
       has historically returned soft-deleted groups; `komondor-nudge` models
       `deleted` explicitly and skips those projects itself
       (`GROUP_DELETED`), which is the client compensating for the server.

    4. **`Project.nudgeable` falls back to a group-derived default** on create
       when the client does not send a real JSON boolean. See
       `POST /projects/new`.

    5. **Two endpoints report failure with HTTP 200 and an `error` body**
       (`GET /read-file`, `GET /directory-files`) while answering 403 with the
       same shape for a rejected path. Clients need both branches;
       `komondor-web`'s `utils/apiError.js` documents this at length.

    6. **`POST /login` is the only route that reports failure as `message`**
       rather than `error`.

  contact:
    name: George Deeks

servers:
  - url: "{scheme}://{host}"
    description: |
      DRIFT: there is NO `/api` base path. Routers are mounted at the root in
      `app.js`. Set the server URL to the origin alone — e.g.
      `http://localhost:3030` — and never append `/api` or `/auth`.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: "localhost:3030"

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login, token introspection and logout.
  - name: Projects
  - name: Samples
  - name: Runs
  - name: Groups
  - name: Users
  - name: Search
  - name: News
  - name: Accessions
  - name: Files
    description: Reading the HPC transfer directory and verifying checksums.
  - name: Options
    description: Controlled vocabularies for run metadata.
  - name: Uploads
  - name: Ops

paths:
  /health:
    get:
      tags: [Ops]
      summary: Liveness probe — "this process is up and answering".
      description: |
        Registered directly on the app in `app.js`, before the routers, and
        unauthenticated.

        Deliberately checks nothing else. It answers 200 even when MongoDB is
        unreachable and the mounts are gone, because a liveness probe that
        fails on a dependency blip has the supervisor restart a process whose
        restart cannot help. Use `/ready` to decide whether to send traffic.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok

  /ready:
    get:
      tags: [Ops]
      summary: Readiness probe — "this process can serve a request end to end".
      description: |
        Registered directly on the app in `app.js`, and unauthenticated.

        Checks the MongoDB connection state, that `DATASTORE_ROOT` is
        configured and readable/writable, that `HPC_TRANSFER_DIRECTORY` is
        configured and readable, and any probe `server.js` has registered
        (the ingest worker, when present).
        Reports 503 while the process is draining.

        Answers **503**, never 500, when the probe itself fails: a 500 reads as
        "the probe is broken" where the intended meaning is "do not send
        traffic here".
      security: []
      responses:
        "200":
          description: Every check passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "503":
          description: |
            At least one check failed, or the process is shutting down.
            `failed` names the checks so whoever is paged does not have to read
            the logs of a process that may not be logging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"

  /test:
    get:
      tags: [Ops]
      summary: Static smoke-test string.
      description: |
        Unauthenticated. Excluded from the jest run by `testPathIgnorePatterns`
        (the filename collides with the test glob), but it is a live route in
        production.
      security: []
      responses:
        "200":
          description: A fixed greeting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a signed JWT.
      description: |
        DRIFT: the path is `/login`. Not `/api/login` (as the stale comment in
        `routes/auth.js` says), and not `/auth/login` (as `komondor-power`
        tries first).

        Three credential sources, checked in order: the local `admin` account
        when `ADMIN_PASSWORD` is set; a hard-coded development user list, but
        only when `NODE_ENV === "development"`; then LDAP.

        DRIFT: this is the ONLY route that reports failure as `message`
        instead of `error`. `komondor-web` special-cases it in
        `utils/apiError.js`.

        Group membership is resolved at login and baked into the token as
        `groups` (see `lib/utils/getUserForToken.js`). It is NOT re-read per
        request, so a membership change does not take effect until the user's
        token expires and they sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Signed JWT. See the `bearerAuth` scheme for its claims.
        "401":
          description: |
            Bad credentials, or a missing username/password. Note the `message`
            key — every other route uses `error`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    const: Bad credentials
        "500":
          description: The credentials were accepted but the token could not be signed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /logout:
    get:
      tags: [Auth]
      summary: No-op logout.
      description: |
        Returns 200 with an empty body. Tokens are stateless and are not
        revoked — logging out is entirely a client-side act of discarding the
        token. It stays valid until `exp`.
      security: []
      responses:
        "200":
          description: Empty body.
    post:
      tags: [Auth]
      summary: Registered, but unreachable.
      description: |
        DEFECT: `routes/auth.js` registers this handler with the four-argument
        signature `(err, req, res, next)`. Express treats a four-arity handler
        as an *error* handler and skips it during normal dispatch, so the
        request falls through to the 404 handler in `app.js`.

        Verified against the running app: `POST /logout` answers
        `404 {"error":"Not found","detail":"Cannot POST /logout"}`.

        Documented because it is registered and because a client that switches
        from `GET /logout` to `POST /logout` will break. Dropping the argument
        would make it behave like the GET.
      security: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"

  /me:
    get:
      tags: [Auth]
      summary: Decode the caller's own token.
      description: |
        Returns the decoded JWT payload, not a database record — `groups` here
        is whatever was baked in at login.

        Note the response shape: `{ user }`, where `user` is `undefined` when
        no `Authorization` header was sent at all (the request still answers
        200). A malformed or expired token answers 401.
      responses:
        "200":
          description: |
            The decoded token payload, or `{}` when the request carried no
            bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/TokenPayload"
        "401":
          description: |
            Invalid or expired token. This route answers with `error` only —
            no `detail`, no `requestId` — unlike the app-level 401 in `app.js`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: Invalid or expired authentication token

  /users:
    get:
      tags: [Users]
      summary: Every user, projected to identity fields only.
      description: |
        Every account is still listed to any authenticated caller — this is not
        admin-only, because `komondor-power` calls it as an ordinary user
        during CSV upload to check that named project owners exist.

        The RECORDS are now projected down to `_id`, `username` and `name`.
        They previously carried every field, including `email`, `isAdmin` and
        `groups` — a ready-made list of who to target and which groups they can
        reach. `isAdmin`, `groups`, `email`, `company` and `lastLogin` are NOT
        returned by this operation.
      responses:
        "200":
          description: All users, identity fields only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      description: |
                        A projection of `User`, not the whole schema.
                      properties:
                        _id:
                          $ref: "#/components/schemas/ObjectId"
                        username:
                          type: string
                        name:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"

  /user:
    get:
      tags: [Users]
      summary: One user plus the projects they own.
      description: |
        The user record is merged into the response object rather than nested,
        and `username` is echoed from the query even when no `User` document
        exists — so a 200 here does NOT prove the user is known. See
        BREAKING_CHANGES §7.

        The user record is projected to `_id`, `username`, `name`, `email` and
        `company`. `isAdmin`, `groups` and `lastLogin` are NOT returned.

        **`projects` is now filtered by the CALLER's visibility**, not by
        ownership alone. It previously ran an unfiltered
        `Project.find({ owner })`, which made this endpoint a way around the
        filter `GET /projects` applies — pick any owner and read their
        projects, whatever group they were in. Viewing another user's profile
        therefore shows fewer projects than before.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, their owned projects, and the echoed username.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    description: |
                      A projection of `User` merged with the caller-visible
                      projects. Not the whole `User` schema — see the operation
                      description for what is withheld.
                    properties:
                      _id:
                        $ref: "#/components/schemas/ObjectId"
                      username:
                        type: string
                        description: Echoed from the query, present even for an unknown user.
                      name:
                        type: string
                      email:
                        type: string
                      company:
                        type: string
                      projects:
                        type: array
                        description: Owned by this user AND visible to the caller.
                        items:
                          $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/verify-ldap:
    post:
      tags: [Users]
      summary: Ask LDAP whether a username exists.
      description: |
        Used to validate a project owner who has never logged in, so has no
        `User` document yet.

        Note the 500 shape: this handler builds its own body with `message`
        alongside `error`, rather than going through `handleError`. It is the
        only route that does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        "200":
          description: "The lookup result. `exists: false` is a 200, not a 404."
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                      cn:
                        type: string
                      mail:
                        type: string
        "400":
          description: "`username` missing or not a string."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          description: LDAP could not be reached or queried.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string

  /groups:
    get:
      tags: [Groups]
      summary: The groups the caller belongs to.
      description: |
        Resolved by `Group.GroupsIAmIn` in READ mode. Admins and users named in
        `FULL_RECORDS_ACCESS_USERS` get every group; everyone else gets the
        groups named by their token's `groups` claim, falling back to matching
        their LDAP `memberOf` strings against `Group.ldapGroups`.

        **Soft-deleted groups are excluded by default**, for everybody
        including admins: a deleted group must stop authorising anyone.
        Consumers no longer need to filter `deleted` themselves, though
        `komondor-nudge` still does and reports the skip as `GROUP_DELETED`.

        Because nothing else can list them, an ADMIN may pass
        `?includeDeleted=true` to see soft-deleted groups — otherwise
        `POST /groups/resurrect` exists with no way to discover what to
        resurrect. A non-admin sending that parameter is REFUSED with 403
        rather than quietly given the filtered list.
      parameters:
        - name: includeDeleted
          in: query
          required: false
          description: |
            Admin only. Send the literal string `true` to include soft-deleted
            groups. Compared against the string, so the array express builds
            for a repeated parameter does not match. A non-admin sending it
            gets 403.
          schema:
            type: string
            enum: ["true"]
      responses:
        "200":
          description: The caller's groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          description: Group resolution failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /groups/new:
    post:
      tags: [Groups]
      summary: Create a group. Admin only.
      description: |
        One of only two routes in the API that answer **201** on create; the
        `/options/*` collections answer 200 for the same act.

        A successful save creates the group's directory under
        `DATASTORE_ROOT` as a post-save side effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ldapGroups]
              properties:
                name:
                  type: string
                ldapGroups:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          description: Validation or save failure — both arrive as 500 here, not 400.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /groups/edit:
    post:
      tags: [Groups]
      summary: Rename a group or change its LDAP mapping.
      description: |
        Permitted for admins and for any member of the group. Note that
        `ldapGroups` and `name` are assigned unconditionally, so omitting
        either clears it — this is a full replace, not a patch, despite the
        POST.

        `sendToEna` is the one field treated as optional: it is only written
        when present in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  $ref: "#/components/schemas/ObjectId"
                name:
                  type: string
                ldapGroups:
                  type: array
                  items:
                    type: string
                sendToEna:
                  type: boolean
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          description: "`id` not provided."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          description: No group with that id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: Group not found
        "500":
          description: Save failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /groups/delete:
    post:
      tags: [Groups]
      summary: Soft-delete a group. Admin only.
      description: |
        DRIFT: sets `deleted: true` and saves. The document is NOT removed, its
        directory under `DATASTORE_ROOT` is untouched, and the projects,
        samples and runs pointing at it keep working.

        Whether a soft-deleted group is filtered out of reads is the
        responsibility of `Group.GroupsIAmIn` and each consumer, and has been
        inconsistent — this is the field behind the `GROUP_DELETED` decision in
        `komondor-nudge`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Soft-deleted. Note this route answers `message`, not `error`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    const: Group deleted successfully
        "400":
          description: "`id` not provided."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: No group with that id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: Group not found
        "500":
          $ref: "#/components/responses/ServerError"

  /groups/resurrect:
    post:
      tags: [Groups]
      summary: Undo a soft-delete. Admin only.
      description: "Sets `deleted: false`. The exact inverse of `/groups/delete`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    const: Group restored successfully
        "400":
          description: "`id` not provided."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: No group with that id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: Group not found
        "500":
          $ref: "#/components/responses/ServerError"

  /projects:
    get:
      tags: [Projects]
      summary: Projects visible to the caller.
      description: |
        Visibility comes from `buildVisibilityFilter`: full-access users and
        admins see everything, everyone else sees projects they own or that
        belong to one of their token's groups. A caller with neither a username
        nor groups matches nothing (BREAKING_CHANGES §1).

        Sorted by `createdAt` descending, in JavaScript rather than in Mongo.
        `group` is populated.
      responses:
        "200":
          description: Visible projects, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"

  /projects/names:
    get:
      tags: [Projects]
      summary: Every project name. Authenticated.
      description: |
        Requires a bearer token. This route previously had no
        `isAuthenticated` guard and handed every project name in the database
        to anonymous callers.

        The list is still UNFILTERED across groups, deliberately:
        `Project.name` carries a unique index, so a client needs the full list
        to tell a user that the name they have chosen is already taken. It
        returns names only — no ids, owners or group membership.
      responses:
        "200":
          description: All project names, across every group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectNames:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"

  /project:
    get:
      tags: [Projects]
      summary: One project, with samples, additional files and on-disk status.
      description: |
        The id is a **query parameter**, not a path segment.

        Alongside the project this returns a reconciliation of the database
        records against the `additional/` directory on disk. A datastore that
        cannot be read degrades to `additionalFilesStatus.status = "UNKNOWN"`
        rather than failing the request. Once a project has left `hpc`, the
        directory is not read: the listing is null and reconciliation is
        `NOT_APPLICABLE`.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: The project and its file reconciliation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  location:
                    $ref: "#/components/schemas/EntityLocation"
                  actualAdditionalFiles:
                    type: [array, "null"]
                    items:
                      type: string
                    description: Filenames actually present in the project's `additional/` directory.
                  additionalFilesStatus:
                    $ref: "#/components/schemas/FileReconciliation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /project/toggle-nudgeable:
    put:
      tags: [Projects]
      summary: Set a project's nudgeable flag.
      description: |
        Requires WRITE access to the group that owns the project: the project
        is loaded first and the caller is authorised against its group, so a
        project outside the caller's writable groups answers 403.

        `nudgeable` must be a real JSON boolean — a non-boolean is a 400, not a
        truthy coercion, because `"false"` would otherwise set the opposite
        flag. This is stricter than `POST /projects/new`, which falls back to
        the group default rather than refusing.

        Answers `message` on success and does not return the updated document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_id, nudgeable]
              properties:
                _id:
                  $ref: "#/components/schemas/ObjectId"
                nudgeable:
                  type: boolean
      responses:
        "200":
          description: Updated. The project itself is not returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    const: Nudgeable status updated successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /projects/new:
    post:
      tags: [Projects]
      summary: Create a project.
      description: |
        Requires WRITE access to the target group. A cross-group *reader*
        (`FULL_RECORDS_ACCESS_USERS`) cannot create a project in a group they
        are not a member of.

        `nudgeable` is HONOURED when the body carries a real JSON boolean, and
        otherwise DERIVED from the target group:

            nudgeable = (targetGroup.sendToEna === true)

        This replaced a hard-coded '2Blades' group ObjectId that was a stand-in
        for exactly this flag but only covered one of the two groups carrying
        it. A non-boolean `nudgeable` (for example the string `"true"`) is NOT
        a 400 here: it is discarded in favour of the group default, and the
        server logs `[projects/new] Ignoring non-boolean 'nudgeable'`.
        This API honours whatever real boolean the client sends. It does NOT
        currently mean `komondor-power`'s `project_nudgeable` CSV column
        reaches the database: `insertMetadata.ts` there builds the request as
        `nudgeable: !doNotSendToEna` and does not forward `project_nudgeable`
        under this field at all, so every project it creates still gets this
        API's group-derived default in practice, regardless of how that column
        serialises. Tracked as a Power-side gap in `docs/CONTRACTS.md` — this
        endpoint's own behaviour is not the drift, that consumer's request body
        is.

        Note that a group whose `sendToEna` is absent or `false` produces
        `nudgeable: false`. `PUT /project/toggle-nudgeable` sets the flag
        afterwards.

        NOT idempotent, unlike `/samples/new` and `/runs/new`: a repeated name
        hits the unique index on `Project.name` and fails. There is no 200
        branch here.

        On failure after the document is saved, the handler deletes it again —
        but files already moved are not cleaned up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, group, shortDesc, longDesc, owner]
              properties:
                name:
                  type: string
                group:
                  $ref: "#/components/schemas/ObjectId"
                shortDesc:
                  type: string
                longDesc:
                  type: string
                owner:
                  type: string
                  description: A username, which need not correspond to an existing `User`.
                doNotSendToEna:
                  type: boolean
                doNotSendToEnaReason:
                  type: string
                nudgeable:
                  type: boolean
                  description: |
                    Honoured when sent as a real JSON boolean. Anything else
                    (including the strings `"true"` / `"false"`) is discarded
                    with a server-side warning and the group-derived default is
                    used instead. See the operation description.
                additionalFiles:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          description: Missing group, or mongoose validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "500":
          $ref: "#/components/responses/ServerError"

