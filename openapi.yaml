        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /samples/new:
    post:
      tags: [Samples]
      summary: Create a sample, or return the existing one.
      description: |
        **IDEMPOTENT CREATE — 200 vs 201.** Before inserting, the handler looks
        for a sample with the same `project` and `name`. If one exists it
        answers **200** with `{ sample, idempotent: true, message }` and the
        PRE-EXISTING document. A genuine insert answers **201** with
        `{ sample }` and no `idempotent` key.

        A client that treats 200 as "created" will double-count, and one that
        treats anything but 201 as failure will break on retry. Branch on the
        status code, or on the presence of `idempotent`.

        `project` is mandatory, so the lookup depends on `name` alone: a
        nameless non-TPlex sample is never deduplicated.

        **The stored `group` is DERIVED from the parent project**, not taken
        from the body. `group` is still required and is cross-checked: a
        `group` that does not own the submitted `project` is a 400 ("The
        submitted group does not own the submitted project."), never a silently
        mis-filed sample. Write access is authorised against the PROJECT's
        group, and that check runs BEFORE the mismatch check so the status code
        cannot be used to probe which group owns a project the caller cannot
        see.

        An unknown `project` answers 404. Malformed ids answer 400 and the
        database is never queried.

        TPlex CSV text is stored with spreadsheet formula characters
        neutralised — a value beginning `=`, `+`, `-`, `@`, tab or CR is
        prefixed with an apostrophe and force-quoted, except plain numbers
        such as `-80`. A consumer round-tripping `tplexCsv` should strip a
        leading `"'` when the field starts with one of those characters.

        TPlex mode: when `tplexCsv` is a non-empty array, ONE sample is created
        with the array flattened to CSV text in `tplexCsv`, the per-organism
        fields forced to null, and a name derived from the first row when none
        was supplied. `additionalFiles` is ignored in this mode.

        If the parent Project has left `hpc`, the authorised request is
        refused before idempotency or file work with 409 and
        `code: PROJECT_STORAGE_READ_ONLY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, project, owner]
              properties:
                name:
                  type: string
                project:
                  $ref: "#/components/schemas/ObjectId"
                group:
                  $ref: "#/components/schemas/ObjectId"
                owner:
                  type: string
                scientificName:
                  type: string
                  description: Required unless this is a TPlex sample.
                commonName:
                  type: string
                  description: Required unless this is a TPlex sample.
                ncbi:
                  type: string
                  description: Numeric taxonomy id. Required unless this is a TPlex sample.
                conditions:
                  type: string
                  description: Required unless this is a TPlex sample.
                tplexCsv:
                  type: array
                  description: Rows of a TPlex CSV. Presence of a non-empty array selects TPlex mode.
                  items:
                    type: object
                additionalFiles:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: |
            A sample with this name already existed for this project. The body
            is the existing document — nothing was created.
          content:
            application/json:
              schema:
                type: object
                required: [sample, idempotent]
                properties:
                  sample:
                    $ref: "#/components/schemas/Sample"
                  idempotent:
                    const: true
                  message:
                    const: Sample with this name already exists for this project
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sample:
                    $ref: "#/components/schemas/Sample"
        "400":
          description: |
            Missing or malformed `group` / `project`, a `group` that does not
            own the submitted `project`, a TPlex payload whose rows are not
            objects, or mongoose validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          description: |
            The parent `project` does not exist. New: the handler must load the
            project to derive the sample's group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The Project is migrating, archived, or has invalid storage state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /runs:
    get:
      tags: [Runs]
      summary: Runs visible to the caller, newest first.
      responses:
        "200":
