  /runs/names/{sampleId}:
    get:
      tags: [Runs]
      summary: Distinct run names within a sample.
      description: |
        Requires READ access to the group that owns the SAMPLE. The sample is
        loaded first, so an unknown `sampleId` answers 404 and a sample in a
        group the caller cannot read answers 403. This previously answered for
        any id with no group check at all.

        A malformed `sampleId` is a 400 and the database is never queried.
      parameters:
        - name: sampleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Unique, non-empty names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runNames:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
