        "500":
          $ref: "#/components/responses/ServerError"

  /run:
    get:
      tags: [Runs]
      summary: One run, with raw and additional file reconciliation.
      description: |
        Reconciles two directories, `raw/` and `additional/`, and returns a
        separate status object for each. Note the asymmetric key names:
        `actualReads` for raw files but `actualAdditionalFiles` for the others.
        No directory is read after the owning Project leaves `hpc`; both
        listings are null and both statuses are `NOT_APPLICABLE`.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: The run and both reconciliations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
                  location:
                    $ref: "#/components/schemas/EntityLocation"
                  actualReads:
                    type: [array, "null"]
                    items:
                      type: string
                    description: Filenames present in the run's `raw/` directory.
                  actualAdditionalFiles:
                    type: [array, "null"]
                    items:
                      type: string
                  rawFilesStatus:
                    $ref: "#/components/schemas/FileReconciliation"
                  additionalFilesStatus:
                    $ref: "#/components/schemas/FileReconciliation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /runs/new:
    post:
      tags: [Runs]
      summary: Create a run, or return the existing one.
      description: |
        **IDEMPOTENT CREATE — 200 vs 201**, the same split as `/samples/new`.
        A run already existing with this `sample` + `name` answers **200** with
        `{ run, idempotent: true, message }` and the pre-existing document; a
        genuine insert answers **201** with `{ run }`.

        Unlike `/samples/new`, the lookup is unconditional — `Run.findOne({
        sample, name })` runs on every request.

        **The 201 is returned BEFORE the work is done.** The handler saves the
        run, ENQUEUES an ingest job, and only then responds. File movement, the
        overseer email and MD5 verification happen later in a background
        worker, so a 201 means "the run record exists and the ingest is
        queued", not "your files have arrived" — expect them seconds to minutes
        afterwards. Both the 201 and the idempotent 200 carry `jobId`; poll
        `GET /runs/{id}/status` and read `ingest.status` to find out what
        actually happened. A failed job surfaces there as `failed` with
        `lastError`, where a run previously just sat at `pending` forever.

        The enqueue happens BEFORE the response, so a queue that cannot record
        the work fails the request (and the existing rollback deletes the run)
        rather than returning a 201 for an ingest nobody will ever run. The
        idempotent branch enqueues too — the job is keyed on the run id, so it
        cannot double-queue, and a client retrying after a lost 201 can still
        trigger an ingest that never happened.

        **A re-POST does NOT retry a job already sitting at `failed`.** The
        enqueue is `$setOnInsert`, so it finds the dead job and changes
        nothing. `POST /runs/{id}/reingest` is the only way to retry one.

        **The idempotent branch requires WRITE access to the EXISTING RUN's
        group**, not read access — see the paragraph below on the write access
        a *new* run needs, which is about the sample's group. The two can
        disagree: a run predating the group remediation can carry a group that
        differs from its sample's, because the old code stored `req.body.group`
        unchecked. That branch is not a lookup — it enqueues an ingest carrying
        the caller's own `rawFiles` against the run that came back — so a
        cross-group *reader* (`FULL_RECORDS_ACCESS_USERS`) who re-POSTs a run
        living in a group they cannot write to now gets a **403** where they
        previously got a 200 with the run.

        Because `{ sample, name }` is now unique on `Run`, two concurrent
        retries of a lost 201 can both miss the lookup; whichever loses the
        save race re-reads the winner and returns the same idempotent 200
        rather than surfacing the duplicate-key error as a 500.

        **`group` must own `sample`.** The stored group is taken from the
        sample either way; a mismatched `group` in the body is a 400. Creating
        a run requires WRITE access to the sample's group, so a cross-group
        *reader* (`FULL_RECORDS_ACCESS_USERS`) can no longer create runs in
        groups they are not a member of.

        A `sample` that does not exist is a **400** ("The submitted sample does
        not exist."), not a 404 — this endpoint already reports body-field
        problems as 400, and a 404 on a POST invites clients to read it as
        "endpoint missing". Because the sample must be looked up before its
        group can authorise anything, the 400-vs-403 split is a weak existence
        oracle for sample ids.

        Request validation is bespoke (`validateNewRunRequest`) and runs before
        the permission check, so an invalid body gets 400 even from a caller
        who would have been refused with 403. A malformed `sample` id is a 400
        and the database is never queried.

        After authorisation, Project storage is checked before the idempotent
        lookup. Any state other than `hpc` returns terminal 409
        `PROJECT_STORAGE_READ_ONLY`, including a repeated request for a run
        that already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sample
                - name
                - sequencingProvider
                - sequencingTechnology
                - librarySource
                - libraryType
                - librarySelection
                - libraryStrategy
                - owner
                - group
                - rawFiles
                - rawFilesUploadInfo
              properties:
                sample:
                  $ref: "#/components/schemas/ObjectId"
                name:
                  type: string
                  minLength: 3
                  maxLength: 80
                sequencingProvider:
                  type: string
                sequencingTechnology:
                  type: string
                librarySource:
                  type: string
                libraryType:
                  type: string
                  description: |
                    A free-text string, NOT a reference to the `LibraryType`
                    option document. Nothing validates it against
                    `/options/librarytype`.
                librarySelection:
                  type: string
                libraryStrategy:
                  type: string
                insertSize:
                  type: string
                owner:
                  type: string
                group:
                  $ref: "#/components/schemas/ObjectId"
                rawFiles:
                  type: array
                  minItems: 1
                  description: Each entry must carry a `name` or a `data.name`.
                  items:
                    type: object
                rawFilesUploadInfo:
                  type: object
                  required: [method]
                  properties:
                    method:
                      type: string
                      enum: [hpc-mv, local-filesystem]
                    relativePath:
                      type: string
                      description: Required when `method` is `hpc-mv`, unless the first raw file carries one.
                additionalFiles:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: A run with this name already existed for this sample.
          content:
            application/json:
              schema:
                type: object
                required: [run, idempotent]
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
                  idempotent:
                    const: true
                  jobId:
                    description: |
                      The ingest job for this run. Keyed on the run id, so this
                      is the existing job rather than a new one. Null only if
                      the queue returned nothing.
                    oneOf:
                      - $ref: "#/components/schemas/ObjectId"
                      - type: "null"
                  message:
                    const: Run with this name already exists for this sample
        "201":
          description: |
            The run document was created and the ingest job was queued. File
            movement and MD5 verification have not happened yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
                  jobId:
                    $ref: "#/components/schemas/ObjectId"
        "400":
          description: |
            Bespoke validation failed, a malformed id, a `sample` that does not
            exist, a `group` that does not own the `sample`, or mongoose
            rejected the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "409":
          description: The Project is migrating, archived, or has invalid storage state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /runs/{id}/status:
    get:
      tags: [Runs]
      summary: Processing and MD5 verification progress for one run.
      description: |
        The endpoint to poll after a 201 from `/runs/new`. Returns the run's
        `status` and `md5VerificationStatus` enums, the queue's view of the
        ingest in `ingest`, plus a per-file breakdown built from the `Read`
        documents.

        `ingest` is where a background failure becomes visible: a job that has
        exhausted its attempts reports `status: "failed"` with `lastError`,
        instead of the run silently sitting at `pending`.

        `progress.percentComplete` is 100 when the run has no read files at
        all, which reads as "finished" rather than "nothing to do".

        `projectStorage` reports the owning Project's current lifecycle. Once
        it is read-only, historical MD5 fields remain unchanged and
        `md5VerificationApplicable` is false with reason
        `PROJECT_STORAGE_READ_ONLY`.

        A malformed `id` is a 400 and the database is never queried.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Status and progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    $ref: "#/components/schemas/ObjectId"
                  runName:
                    type: string
                  status:
                    $ref: "#/components/schemas/RunStatus"
                  statusError:
                    type: [string, "null"]
                    description: Populated when `status` is `error`.
                  ingest:
                    $ref: "#/components/schemas/IngestJobSummary"
                  md5VerificationStatus:
                    $ref: "#/components/schemas/Md5VerificationStatus"
                  md5VerificationAttempts:
                    type: integer
                  md5VerificationLastAttempt:
                    type: [string, "null"]
                    format: date-time
                  md5VerificationCompletedAt:
                    type: [string, "null"]
                    format: date-time
                  md5VerificationApplicable:
                    type: boolean
                  md5VerificationNotApplicableReason:
                    type: [string, "null"]
                    enum: [PROJECT_STORAGE_READ_ONLY, null]
                  projectStorage:
                    $ref: "#/components/schemas/StorageSummary"
                  progress:
                    type: object
                    properties:
                      totalFiles:
                        type: integer
                      verifiedFiles:
                        type: integer
                      mismatchedFiles:
                        type: integer
                      percentComplete:
                        type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        fileName:
                          type: [string, "null"]
                        md5Original:
                          type: [string, "null"]
                        md5Destination:
                          type: [string, "null"]
                        md5Mismatch:
                          type: [boolean, "null"]
                          description: "`null` means not yet checked."
                        lastChecked:
                          type: [string, "null"]
                          format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /runs/{id}/reingest:
    post:
      tags: [Runs]
      summary: Return a permanently failed ingest to the queue.
      description: |
        The only way to retry an ingest that has exhausted its attempts. A
        re-POST to `/runs/new` does NOT do this: `enqueueRunIngest` is keyed on
        the run id and uses `$setOnInsert`, so it finds the dead job and
        changes nothing. Before this endpoint existed, a failed ingest had no
        retry at all short of editing the database.

        It is a separate endpoint rather than a side effect of `/runs/new` on
        purpose: making a duplicate submission re-run the ingest would replay
        file moves over a run that is already healthy. A retry has to be asked
        for.

        **Requires WRITE access to the run's group.** There is deliberately no
        owner fallback of the kind `GET /runs/{id}/status` has — those answer a
        question, this does work: it moves files into the run's datastore
        directory and writes `Read` documents against it.

        The job is reset to `pending` with `attempts` back to 0 and no lease,
        so the next worker poll picks it up immediately — `claimNextJob`
        increments attempts as it claims and fails anything already past
        `maxAttempts`, so a job left at its exhausted count would simply be
        re-failed without the ingest ever being re-attempted. There is no
        backoff and no throttle: an operator retrying into a full disk or a
        dead mount will hit the same wall again, bounded only by `maxAttempts`
        per attempt.

        The run itself is moved back to `status: "pending"` with `statusError`
        cleared, so it does not read as broken while its retry is queued. A
        second failure puts it back to `error`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: The ingest has been returned to the queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    $ref: "#/components/schemas/ObjectId"
                  jobId:
                    $ref: "#/components/schemas/ObjectId"
                  ingest:
                    $ref: "#/components/schemas/IngestJobSummary"
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          description: |
            No such run, or the run has no ingest job to retry. The two are not
            distinguished in the body beyond the message, for the same reason
            `/runs/batch-status` does not split "missing" from "not yours".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: |
            The ingest job exists but is not `failed`, or the owning Project
            has left `hpc`. Storage refusal carries
            `code: PROJECT_STORAGE_READ_ONLY` and happens before the job or
            replacement payload is inspected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /runs/batch-status:
    post:
      tags: [Runs]
      summary: Status for up to 100 runs at once.
      description: |
        A POST because the id list goes in the body, not because anything is
        created.

        **Every requested id is accounted for.** Runs the caller may not see
        are omitted from `runs`, so `total` can be lower than `requested` — but
        an omitted id now appears in `missing`, and an id that was not a
        well-formed ObjectId appears in `invalid`. Clients must stop treating a
        short `runs` array as a complete answer.

        `missing` deliberately does NOT distinguish "no such run" from "exists
        but not yours": splitting them would turn this endpoint into an
        existence oracle for other groups' run ids.

        Each entry also carries `ingest`, the same summary as
        `GET /runs/{id}/status`, so the two endpoints agree about what a run's
        status is. It also carries `projectStorage`; archived rows keep their
        historical MD5 values but set `md5VerificationApplicable: false`.
        The caller's groups are read once for the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runIds]
              properties:
                runIds:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Status for the accessible subset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        runId:
                          $ref: "#/components/schemas/ObjectId"
                        runName:
                          type: string
                        status:
                          $ref: "#/components/schemas/RunStatus"
                        statusError:
                          type: [string, "null"]
                        ingest:
                          $ref: "#/components/schemas/IngestJobSummary"
                        md5VerificationStatus:
                          $ref: "#/components/schemas/Md5VerificationStatus"
                        md5VerificationAttempts:
                          type: integer
                        md5VerificationLastAttempt:
                          type: [string, "null"]
                          format: date-time
                        md5VerificationCompletedAt:
                          type: [string, "null"]
                          format: date-time
                        md5VerificationApplicable:
                          type: boolean
                        md5VerificationNotApplicableReason:
                          type: [string, "null"]
                          enum: [PROJECT_STORAGE_READ_ONLY, null]
                        projectStorage:
                          $ref: "#/components/schemas/StorageSummary"
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
                    description: Length of `runs`, not the number of ids requested.
                  requested:
                    type: integer
                    description: |
                      How many well-formed, de-duplicated ids were looked up.
                  missing:
                    type: array
                    description: |
                      Requested ids that produced no entry in `runs` — either no
                      such run, or one the caller may not see. The two are
                      deliberately not distinguished.
                    items:
                      $ref: "#/components/schemas/ObjectId"
                  invalid:
                    type: array
                    description: |
                      Submitted values that were not well-formed ObjectIds,
                      truncated to 64 characters each.
                    items:
                      type: string
        "400":
          description: "`runIds` is not an array, or has more than 100 entries."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"

  /search:
    get:
      tags: [Search]
      summary: Case-insensitive name search across projects, samples and runs.
      description: |
        Matched in MongoDB with an escaped, case-insensitive regex over `name`,
        scoped by the same visibility filter as the list endpoints.

        An absent, non-string, empty or over-200-character query answers 200
        with `results: []` — an ARRAY, where a successful search returns an
        OBJECT of three arrays. Callers must handle both shapes.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Repeated values are tolerated; the first is used.
      responses:
        "200":
          description: Results, or an empty array for an unusable query.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    oneOf:
                      - type: object
                        properties:
                          projects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Project"
                          samples:
                            type: array
                            items:
                              $ref: "#/components/schemas/Sample"
                          runs:
                            type: array
                            items:
                              $ref: "#/components/schemas/Run"
                      - type: array
                        maxItems: 0
                        description: Returned when the query was unusable.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          description: |
            The combined search failed. Note that the three single-entity
            routes below swallow the same failure as a 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /search/project:
    get:
      tags: [Search]
      summary: Name search over projects only.
      description: |
        DRIFT: a search FAILURE answers **200** with
        `{ results: [], error }`, not 5xx. This is the contract existing
        consumers rely on, so an empty `results` does not mean "no matches" —
        check for `error`.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          $ref: "#/components/responses/EntitySearchResults"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /search/sample:
    get:
      tags: [Search]
      summary: Name search over samples only.
      description: Same 200-on-failure contract as `/search/project`.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          $ref: "#/components/responses/EntitySearchResults"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /search/run:
    get:
      tags: [Search]
      summary: Name search over runs only.
      description: Same 200-on-failure contract as `/search/project`.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          $ref: "#/components/responses/EntitySearchResults"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /news:
    get:
      tags: [News]
      summary: The 20 most recent news items the caller may see.
      description: |
        News items are created as a side effect of saving a project, sample or
        run. The response is a projection, not the stored document: `owner`
        is renamed to `user`, and `dateHuman` is a server-rendered
        en-US string ("Today at 3:04 PM").
      responses:
        "200":
          description: Up to 20 items, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          examples: [project, sample, run]
                        user:
                          type: string
                        name:
                          type: string
                        body:
                          type: string
                        date:
                          type: string
                          format: date-time
                        dateHuman:
                          type: string
                        link:
                          type: object
                          properties:
                            name:
                              type: string
                            query:
                              type: object
                              properties:
                                id:
                                  type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"

  /accessions/new:
    post:
      tags: [Accessions]
      summary: Attach ENA accessions to a project, sample or run.
      description: |
        Requires the `hasFullRecordsAccess` population — admins, the literal
        `admin` account, and usernames listed in `FULL_RECORDS_ACCESS_USERS` —
        NOT mere group membership. This is the return leg of the
        `/accessions/csv` export that the same predicate already gates: an
        accession is the identifier ENA issues, not the group's own metadata,
        and its consequences are external and public. Group write access would
        also have been the wrong gate, since an ENA admin is typically not a
        member of the groups they submit for.

        The record's group is still checked, as a READ: the group must be live.
        Because `Group.GroupsIAmIn` excludes soft-deleted groups for everybody,
        a retired group stops authorising accession writes into records nobody
        can see any more, and a record with a dangling group reference is
        refused rather than written.

        `accessions` is REQUIRED and REPLACES the stored array; it does not
        append. Omitting it used to write `undefined`, which mongoose strips —
        the request answered 200 having changed nothing. That silent no-op is
        now a 400. "Clear the accessions" is an explicit `[]`.

        `releaseDate` is only honoured when `type` is `project`.

        On success the body is EMPTY — `res.status(200).send()` with no
        argument. Do not parse it as JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, typeId, accessions]
              properties:
                type:
                  type: string
                  enum: [project, sample, run]
                typeId:
                  $ref: "#/components/schemas/ObjectId"
                accessions:
                  type: array
                  description: |
                    Required. Replaces the stored array wholesale. Send `[]` to
                    clear.
                  items:
                    type: string
                releaseDate:
                  type: string
                  description: "DD-MM-YYYY. Stored as a string; ignored unless `type` is `project`."
      responses:
        "200":
          description: Updated. Empty body.
        "400":
          description: |
            Bad `type`, missing or malformed `typeId`, or `accessions` absent
            or not an array of strings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GroupPermissionDenied"
        "404":
          description: No record of that type with that id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Update failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /accessions/csv:
    get:
      tags: [Accessions]
      summary: Cross-group CSV export of every run. Restricted.
      description: |
        Ignores group membership by design — it returns every run in the
        database — so it is gated on `hasFullRecordsAccess`: admins, the
        literal `admin` account, and usernames listed in
        `FULL_RECORDS_ACCESS_USERS`. NOT `isAdmin` alone; the ENA admins who
        use this do not carry that claim. See BREAKING_CHANGES §13.

        The CSV is returned as a STRING inside a JSON object, not as a
        `text/csv` body. The heading row keeps a trailing comma, which
        consuming services parse. Fields containing a delimiter are quoted
        (BREAKING_CHANGES §10).

        Rows whose sample, project or group cannot be resolved are skipped and
        logged, so the export can be shorter than the run count.

        `list_of_read_files` contains the effective authoritative location:
        the configured HPC display root for `hpc`/`migrating` projects and
        `s3://` URIs for verified AWS copies. An inconsistent historical file
        path is emitted as `unresolved:<stored path>` rather than pointing at a
        nonexistent HPC file or duplicating the project prefix. One export may
        therefore contain both POSIX and S3 locations.

        DRIFT: `FULL_RECORDS_ACCESS_USERS` on this server must be kept in step
        with `ENA_ADMINS` in komondor-web, which decides who is offered the
        export page. Two hand-maintained allowlists in two repos — this is
        precisely the pattern `docs/CONTRACTS.md` argues against.
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                type: object
                properties:
                  csv:
                    type: string
                    description: |
                      Columns: group, owner, ena_project_submission_date,
                      project_name, project_id, project_accession, sample_name,
                      sample_id, sample_accession, run_name, run_id,
                      run_accession, run_creation_date, list_of_read_files.
                      Multi-valued cells are `;`-joined.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller lacks full-records access.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: You do not have permission to export all records
        "500":
          $ref: "#/components/responses/ServerError"

  /directory-files:
    get:
      tags: [Files]
      summary: List a directory inside the HPC transfer area.
      description: |
        DRIFT — FAILURE IS REPORTED AS **200** with an `error` body. Missing
        parameter, unconfigured `HPC_TRANSFER_DIRECTORY`, non-existent
        directory, and *empty directory* all answer 200 with
        `{ "error": "..." }`. This is deliberately preserved
        (BREAKING_CHANGES §9) because consumers detect failure by the presence
        of `error`, not by status code.

        The one exception is a rejected path, which answers a real **403**.
        Clients therefore need both branches — see `utils/apiError.js` in
        komondor-web.

        Note that an empty directory is an error here, not an empty list.

        Path containment uses `resolveBelow`, so a name normalising back to the
        root (`.`, `./`, `a/..`) is refused rather than listing every group's
        inbound directory.
      parameters:
        - name: targetDirectoryName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            Either the listing OR a failure. Exactly one of `filesResults` and
            `error` is present.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [filesResults]
                    properties:
                      filesResults:
                        type: array
                        items:
                          type: string
                  - type: object
                    required: [error]
                    properties:
                      error:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The path escaped the transfer directory, or resolved to its root.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: "Access denied: Invalid directory path"

  /directory-files/debug:
    get:
      tags: [Files]
      summary: Report how a directory name resolves on disk. Admin only.
      description: |
        Admin-gated because the response exposes server filesystem layout and
        configuration — `process.cwd()`, `__dirname` and the value of
        `HPC_TRANSFER_DIRECTORY` (BREAKING_CHANGES §8).

        `targetDirectoryName` defaults to the string `"cheese"` when omitted.
      parameters:
        - name: targetDirectoryName
          in: query
          required: false
          schema:
            type: string
            default: cheese
      responses:
        "200":
          description: Resolution report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cwd:
                    type: string
                  __dirname:
                    type: string
                  HPC_TRANSFER_DIRECTORY:
                    type: [string, "null"]
                  targetDirectoryName:
                    type: [string, "null"]
                  cleanedTargetDirectoryName:
                    type: [string, "null"]
                  dirRoot:
                    type: [string, "null"]
                    description: "`null` when the path would escape the transfer directory."
                  withinTransferDirectory:
                    type: boolean
                  exists:
                    type: boolean
                  isDirectory:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"

  /directory-files/verify-md5:
    post:
      tags: [Files]
      summary: Checksum a file in the transfer directory against an expected MD5.
      description: |
        UNUSUAL RESPONSE FRAMING. Headers are flushed with status 200 before
        the checksum starts, and a space character is written periodically to
        stop a reverse proxy timing out on a large file. The JSON body is
        appended at the end.

        Consequences for clients: the status code is 200 before the outcome is
        known, so a mid-stream failure arrives as 200 with an `error` body; and
        the body has leading whitespace, so it must be trimmed before parsing.

        `expectedMd5` is lower-cased and trimmed before comparison.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directoryName, fileName, expectedMd5]
              properties:
                directoryName:
                  type: string
                fileName:
                  type: string
                expectedMd5:
                  type: string
      responses:
        "200":
          description: |
            The comparison, or a mid-stream failure. Preceded by padding
            whitespace in both cases.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [fileName, expectedMd5, calculatedMd5, matches]
                    properties:
                      fileName:
                        type: string
                      expectedMd5:
                        type: string
                      calculatedMd5:
                        type: string
                      matches:
                        type: boolean
                  - type: object
                    required: [error]
                    properties:
                      error:
                        type: string
                      requestId:
                        type: string
        "400":
          description: A required field is missing or not a string.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  requestId:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Path traversal attempt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: "Access denied: Invalid file path"
                  requestId:
                    type: string
        "404":
          description: No such file, or the path is not a regular file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  requestId:
                    type: string
        "500":
          description: Failed before headers were sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  requestId:
                    type: string

  /read-file:
    get:
      tags: [Files]
      summary: Read a small text file from the HPC transfer directory.
      description: |
        DRIFT — the same 200-with-`error` failure contract as
        `/directory-files`, and the same real 403 for a rejected path.

        A SUCCESS returns the file's raw text, not JSON. A FAILURE returns a
        JSON object. The response body type therefore depends on the outcome,
        which no `Content-Type` negotiation will tell you in advance.

        Capped at 5 MiB; anything larger is refused (as a 200 with `error`).
      parameters:
        - name: targetDirectoryName
          in: query
          required: true
          schema:
            type: string
        - name: filename
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file's contents, OR a failure object.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The path escaped the transfer directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    const: "Access denied: Invalid file path"

  /options/libraryselection:
    get:
      tags: [Options]
      summary: List library selection values. Public.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OptionList"
