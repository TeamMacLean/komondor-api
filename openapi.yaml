  /options/librarytype:
    get:
      tags: [Options]
      summary: List library types. Public.
      description: |
        The only option collection with more than a `value`. Each document
        carries `paired`, `extensions` and `indexed`.

        `indexed` marks a library type whose reads carry an index file. It has
        a schema default of `false`, so documents written before the field
        existed report `false` rather than being absent — a client cannot
        distinguish "not indexed" from "predates the field".

        DRIFT: `Run.libraryType` stores a free-text STRING, not a reference to
        one of these documents, and nothing validates one against the other. A
        run can name a library type that does not exist here, and renaming a
        `LibraryType.value` silently orphans every run that used the old
        spelling.
      security: []
      responses:
        "200":
          description: All library types, sorted by `value`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryType"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Options]
      summary: Add a library type.
      description: |
        Shared write semantics for every `/options/*` collection:

        - Requires a bearer token by default. `OPTIONS_WRITE_REQUIRE_AUTH=false`
          restores the old unauthenticated behaviour as an emergency rollback
          (BREAKING_CHANGES §3). GET is always public.
        - Answers **200** on create, not 201, and returns the document under
          `doc` rather than `options`.
        - `indexed` cannot be set here: the document builder in `routes/options.js`
          maps only `value`, `paired` and `extensions`, so `indexed` always
          takes its schema default of `false` on create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  minLength: 1
                paired:
                  type: boolean
                  default: false
                extensions:
                  type: array
                  default: []
                  items:
                    type: string
                indexed:
                  type: boolean
                  deprecated: true
                  description: ACCEPTED AND IGNORED on create. See the operation description.
      responses:
        "200":
          description: Created. Note 200, not 201.
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc:
                    $ref: "#/components/schemas/LibraryType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Options]
      summary: Remove a library type by id.
      description: |
        A missing or malformed `id` is a 400. This guard matters: mongoose
        strips `undefined` from a filter, so `deleteOne({ _id: undefined })`
        would become `deleteOne({})` and remove an arbitrary document.

        Deleting nothing is a 404 (BREAKING_CHANGES §4).
      requestBody:
        $ref: "#/components/requestBodies/OptionId"
      responses:
        "200":
          $ref: "#/components/responses/OptionDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /options/sequencingtechnology:
    get:
      tags: [Options]
      summary: List sequencing technology values. Public.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OptionList"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Options]
      summary: Add a value.
      requestBody:
        $ref: "#/components/requestBodies/OptionValue"
      responses:
        "200":
          $ref: "#/components/responses/OptionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Options]
      summary: Remove a value by id.
      requestBody:
        $ref: "#/components/requestBodies/OptionId"
      responses:
        "200":
          $ref: "#/components/responses/OptionDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"

  /uploads:
    description: |
      A tus 1.0.0 resumable-upload server, mounted with
      `router.use("/uploads", uploadApp)` in `routes/uploads.js`. It handles
      `/uploads` and everything beneath it, and speaks the tus protocol rather
      than this API's JSON conventions — POST to create an upload, PATCH to
      send bytes, HEAD to resume.

      Two things worth knowing:

      - It is NOT behind `isAuthenticated`. The tus sub-app is mounted before
        any auth middleware runs.
      - It applies its own CORS policy with `origin: "*"`, unlike the rest of
        the API, which is restricted to `WEB_APP_URL`.

      Uploaded bytes land in a temporary store and are moved into the datastore
      later, when the owning project/sample/run is created.
    post:
      tags: [Uploads]
      summary: Create an upload (tus).
      description: |
        Standard tus creation. Returns `201` with a `Location` header naming
        the upload resource; subsequent `PATCH`/`HEAD` go to that URL.
      security: []
      parameters:
        - name: Tus-Resumable
          in: header
          required: true
          schema:
            const: 1.0.0
        - name: Upload-Length
          in: header
          required: false
          schema:
            type: integer
        - name: Upload-Metadata
          in: header
          required: false
          schema:
            type: string
      responses:
        "201":
          description: Upload created.
          headers:
            Location:
              schema:
                type: string
            Tus-Resumable:
              schema:
                const: 1.0.0

  /upload/cancel:
    post:
      tags: [Uploads]
      summary: No-op upload cancellation.
      description: |
        DEFECT: does nothing. The handler is `res.status(200).send({})` with no
        body inspection and no cleanup — it does not delete the tus upload, the
        temporary file, or any database record. Kept because clients call it.

        Note the singular `/upload/`, against the tus mount's plural
        `/uploads`.
      responses:
        "200":
          description: Empty object. Nothing was cancelled.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`, signed with `JWT_SECRET` (HS256) by
        `lib/utils/jwtSign.js`.

        **The `exp` claim is mandatory.** `lib/utils/getUserFromRequest.js`
        rejects a structurally valid, correctly signed token that carries no
        `exp` by raising `TokenExpiredError`, which surfaces as 401. This was
        added deliberately (commit "refuse legacy tokens without an expiry
        claim"): tokens issued before August 2026 had no expiry and stayed
        valid forever, including tokens minted during the LDAP incident with an
        empty `groups` claim. Such tokens can only be fixed by re-logging in.

        Tokens expire after `JWT_EXPIRES_IN`, default `7d`.

        **Group membership is a snapshot.** `groups` is resolved once, at
        login, and never re-read. A user added to a group sees nothing new
        until their token expires and they sign in again — that expiry is the
        upper bound on the staleness.

        Requests with NO `Authorization` header are not rejected by the
        app-level middleware; they simply arrive with no `req.user`, and each
        route's `isAuthenticated` guard turns that into a 401. Routes without
        that guard (`/projects/names`, `GET /options/*`, `/health`, `/test`,
        `/login`, `/logout`, `/uploads`) serve anonymous callers.

  parameters:
    SearchQuery:
      name: query
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: |
        Absent, blank, non-string or over 200 characters yields
        `{ results: [] }` rather than an error.

  requestBodies:
    OptionValue:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [value]
            properties:
              value:
                type: string
                minLength: 1

    OptionId:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                $ref: "#/components/schemas/ObjectId"

  responses:
    Unauthenticated:
      description: |
        No usable token. Two distinct bodies reach clients as 401:
        `{ error: "Authentication required" }` from a route's
        `isAuthenticated` guard, and
        `{ error: "Invalid or expired authentication token", detail }` from the
        app-level middleware in `app.js` when a token was present but bad or
        expired.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  error:
                    const: Authentication required
              - type: object
                properties:
                  error:
                    const: Invalid or expired authentication token
                  detail:
                    type: string
                    description: The underlying jsonwebtoken message.
                  requestId:
                    type: string
                    description: Present only when raised by the terminal error handler.

    AdminRequired:
      description: The caller's token lacks `isAdmin`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                const: Admin access required

    GroupPermissionDenied:
      description: |
        The caller is neither the record's owner, nor a member of its group,
        nor an admin. The message embeds the username:
        `User '<username>' does not have permission to ...`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    BadRequest:
      description: A required parameter is missing or malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    NotFound:
      description: |
        No route matched. Emitted by the catch-all in `app.js`, which exists so
        JSON-only clients never receive Express's default HTML body.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                const: Not found
              detail:
                type: string
                examples: ["Cannot POST /logout"]

    NotFoundEnvelope:
      description: The referenced record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    ServerError:
      description: |
        An unhandled failure. In production a 500 replaces `error` with a
        generic string but STILL includes `detail` — komondor-power is an
        internal client and relies on it for diagnostics.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    OptionList:
      description: All values in this collection, sorted by `value`.
      content:
        application/json:
          schema:
            type: object
            properties:
              options:
                type: array
                items:
                  $ref: "#/components/schemas/Option"

    OptionCreated:
      description: Created. Note 200, not 201, and the `doc` key.
      content:
        application/json:
          schema:
            type: object
            properties:
              doc:
                $ref: "#/components/schemas/Option"

    OptionDeleted:
      description: Deleted. The body is an empty object.
      content:
        application/json:
          schema:
            type: object

    EntitySearchResults:
      description: |
        Matches, OR an empty array. A search FAILURE also lands here with
        `results: []` and an `error` string — check for `error` before treating
        an empty array as "no matches".
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  type: object
              error:
                type: string
                description: Present only when the search failed.

  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      # Deliberately not the old hard-coded '2Blades' group id: that literal
      # used to carry meaning in routes/projects.js and reusing it as a generic
      # example invited the reader to think it still does.
      examples: ["507f1f77bcf86cd799439011"]

    ErrorEnvelope:
      type: object
      description: |
        The standard failure body, produced by `handleError` in
        `routes/_utils.js` and by the terminal handler in `app.js`.

        `detail` carries the underlying error message — more specific than
        `error` (e.g. "E11000 duplicate key error" against "Failed to create
        new project.") — and is present even for production 500s.

        Not universal: `/login` uses `message`; `/groups/*` and `/me` send a
        bare `error`; `/read-file` and `/directory-files` send `{ error }` with
        a 200.
      properties:
        error:
          type: string
          description: A user-facing message.
        detail:
          type: string
          description: The underlying error message, for diagnostics.
        requestId:
          type: string
          description: Correlates with the server log line for this failure.
          examples: ["1735689600000-k3j9x2p1a"]
        code:
          type: string
          description: Optional stable machine-readable error code.
        projectId:
          type: string
          description: Present on project-storage refusals.
        storageState:
          type: string
          description: Present on project-storage refusals; may be `invalid`.

    StorageSummary:
      type: object
      description: |
        Public Project-owned storage lifecycle. A Project written before this
        field existed is returned as `hpc`. Samples and runs derive the same
        object as `projectStorage`; they do not store their own copy.
      required: [state, acceptsHpcWrites, authoritativeLocation]
      properties:
        state:
          type: string
          enum: [hpc, migrating, aws_pending_hpc_deletion, aws, invalid]
        acceptsHpcWrites:
          type: boolean
        authoritativeLocation:
          type: [string, "null"]
          enum: [hpc, s3, null]
        s3Uri:
          type: [string, "null"]
        s3VerifiedAt:
          type: [string, "null"]
          format: date-time
        hpcVerifiedAbsentAt:
          type: [string, "null"]
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
        migrationHealth:
          type: [string, "null"]
          enum: [active, needs_attention, null]

    EntityLocation:
      type: object
      description: Display-ready authoritative location for a detail response.
      properties:
        authoritative:
          type: [string, "null"]
          enum: [hpc, s3, null]
        baseUri:
          type: [string, "null"]
        rawUri:
          type: [string, "null"]
          description: Present on run details only.
        additionalUri:
          type: [string, "null"]
        plannedS3Uri:
          type: [string, "null"]
          description: Set while migrating; it is not yet authoritative.

    ReadinessReport:
      type: object
      description: The body of `GET /ready`, identical in shape for 200 and 503.
      properties:
        status:
          type: string
          enum: [ready, "not ready"]
        failed:
          type: array
          description: Names of the failing checks. Empty on 200.
          items:
            type: string
          examples: [["mongodb", "DATASTORE_ROOT"]]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: "`mongodb`, a mount variable name, `ingest-worker`, or `draining`."
              ok:
                type: boolean
              detail:
                type: string
                description: Why, in words — e.g. "connecting", "not configured", "last tick 4s ago".

    TokenPayload:
      type: object
      description: The decoded JWT, as returned by `GET /me`.
      properties:
        username:
          type: string
        name:
          type: string
        company:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        groups:
          type: array
          description: Group ids, resolved AT LOGIN and never refreshed.
          items:
            $ref: "#/components/schemas/ObjectId"
        iat:
          type: integer
        exp:
          type: integer
          description: Mandatory. A token without this is refused as expired.

    User:
      type: object
      description: |
        Created lazily on first successful login, so a project `owner` may name
        a person with no `User` document.
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        username:
          type: string
        name:
          type: string
        company:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        lastLogin:
          type: string
          format: date-time
        groups:
          type: array
          description: |
            Stored on the document but NOT used for authorisation — group
            resolution goes through `Group.GroupsIAmIn` and the token claim.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        safeName:
          type: string
          description: Filesystem-safe name; also the group's directory under `DATASTORE_ROOT`.
        ldapGroups:
          type: array
          description: LDAP `memberOf` strings mapping onto this group. Matched case-insensitively.
          items:
            type: string
        deleted:
          type: boolean
          default: false
          description: |
            SOFT-DELETE FLAG. `POST /groups/delete` sets it; `POST
            /groups/resurrect` clears it. The document, its directory and every
            record referencing it survive.

            Consumers have had to filter on this themselves — `komondor-nudge`
            declares the field on its read-only model and records
            `GROUP_DELETED` when it skips a project for this reason.
        sendToEna:
          type: boolean
          default: false
        oldId:
          type: string
          description: Migration artefact.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          description: Unique across the collection.
        safeName:
          type: string
        owner:
          type: string
        shortDesc:
          type: string
        longDesc:
          type: string
        group:
          description: An ObjectId, or the populated `Group` on endpoints that populate it.
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - $ref: "#/components/schemas/Group"
        path:
          type: string
          description: Datastore-relative path, `/<group.safeName>/<project.safeName>`.
        isPublic:
          type: boolean
          default: false
        accessions:
          type: array
          items:
            type: string
        releaseDate:
          type: string
          description: "ENA submission date, stored as a `DD-MM-YYYY` STRING, not a date."
        doNotSendToEna:
          type: boolean
          default: false
        doNotSendToEnaReason:
          type: string
        nudgeable:
          type: boolean
          default: true
          description: |
            GROUP-DERIVED DEFAULT ON CREATE. `POST /projects/new` honours a
            real JSON boolean from the client and otherwise computes
            `nudgeable = (targetGroup.sendToEna === true)`. A group with
            `sendToEna` absent or `false` therefore produces `nudgeable:
            false`. `PUT /project/toggle-nudgeable` sets the flag afterwards,
            and requires write access to the project's group.

            `komondor-nudge` reads this field directly from MongoDB to decide
            whether to email a project owner. A project where the field is
            ABSENT (predating the field) is skipped and recorded as
            `NUDGEABLE_UNDEFINED` unless
            `NUDGE_INCLUDE_UNDEFINED_NUDGEABLE=true` — so absent and `false`
            are not the same thing to that consumer, even though the API can no
            longer produce an absent value.
        storage:
          $ref: "#/components/schemas/StorageSummary"
        nudges:
          type: array
          description: |
            Timestamps of nudge emails sent. Written by komondor-nudge directly
            against MongoDB (`$push`), never through this API.
          items:
            type: string
            format: date-time
        samples:
          type: array
          description: Virtual. Populated by `GET /project` only.
          items:
            $ref: "#/components/schemas/Sample"
        additionalFiles:
          type: array
          description: Virtual. Populated by `GET /project` only.
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Sample:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          description: |
            Optional at the schema level because TPlex samples arrive nameless;
            a pre-validate hook fills it from `safeName` when it is missing, so
            a stored sample always has one.
        safeName:
          type: string
        project:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - $ref: "#/components/schemas/Project"
        projectStorage:
          $ref: "#/components/schemas/StorageSummary"
        group:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - $ref: "#/components/schemas/Group"
        owner:
          type: string
        scientificName:
          type: [string, "null"]
          description: Required for non-TPlex samples; forced to null for TPlex ones.
        commonName:
          type: [string, "null"]
          description: Required for non-TPlex samples; forced to null for TPlex ones.
        ncbi:
          type: [string, "null"]
          description: |
            NCBI taxonomy id. A STRING that must parse as a number — validated
            with `isNaN`, so "1.5" and "0x10" pass.
        conditions:
          type: [string, "null"]
        tplexCsv:
          type: [string, "null"]
          description: |
            The whole TPlex CSV as CRLF-joined text, stored on ONE sample.
            Sent to `POST /samples/new` as an ARRAY of row objects and
            flattened server-side. Its presence is what marks a sample as
            TPlex.
        sampleGroup:
          type: string
        accessions:
          type: array
          items:
            type: string
        path:
          type: string
        runs:
          type: array
          description: Virtual. Populated by `GET /sample` only.
          items:
            $ref: "#/components/schemas/Run"
        additionalFiles:
          type: array
          description: Virtual. Populated by `GET /sample` only.
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IngestJobSummary:
      type: [object, "null"]
      description: |
        The ingest queue's view of a run's file processing, as reported by
        `GET /runs/{id}/status` and `POST /runs/batch-status`.

        **`null` means nothing was ever queued** — which is what every run
        created before the queue existed looks like. That is not an error, and
        it is deliberately distinct from a job sitting at `pending`.

        Note this is a different axis from `Run.status`: `ingest.status` is the
        queue's record of the work, `Run.status` is the run's own lifecycle.
        A job that exhausts `maxAttempts` is marked `failed` here and sets the
        run to `error` with the cause in `Run.statusError`.
      properties:
        jobId:
          $ref: "#/components/schemas/ObjectId"
        status:
          type: string
          description: |
            `pending` is queued and not yet claimed (or returned for a retry
            after a backoff). `claimed` is held by a worker under a lease —
            a lease exists so a job held by a SIGKILLed process can be taken
            over rather than stranded. `done` and `failed` are terminal.
          enum:
            - pending
            - claimed
            - done
            - failed
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: [string, "null"]
          description: Cause of the most recent failure. Null until one occurs.
        queuedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RunStatus:
      type: string
      description: |
        Lifecycle of the file-processing work that follows a run's creation.
        Enforced by the mongoose schema, so a value outside this set cannot be
        stored.

        `pending` is the default and is what a fresh 201 from `/runs/new`
        reports. `error` means background processing failed; the cause is in
        `statusError`. Note there is no terminal "cancelled" state.
      enum:
        - pending
        - processing
        - complete
        - error
      default: pending

    Md5VerificationStatus:
      type: string
      description: |
        Checksum verification of the run's read files, tracked separately from
        `status`.

        Note the naming inconsistency with `RunStatus`: this enum uses
        `in_progress` and `failed` where that one uses `processing` and
        `error`. The two are not interchangeable and a client must not map one
        onto the other.
      enum:
        - pending
        - in_progress
        - complete
        - failed
      default: pending

    Run:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          minLength: 3
          maxLength: 80
          description: Unique per sample by convention, not by index — the idempotent create enforces it.
        safeName:
          type: string
        sample:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - $ref: "#/components/schemas/Sample"
        projectStorage:
          $ref: "#/components/schemas/StorageSummary"
        group:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - $ref: "#/components/schemas/Group"
        owner:
          type: string
        sequencingProvider:
          type: string
        sequencingTechnology:
          type: string
        librarySource:
          type: string
        libraryType:
          type: string
          description: |
            Free text. NOT a reference to a `LibraryType` document, and not
            validated against `/options/librarytype`.
        librarySelection:
          type: string
        libraryStrategy:
          type: string
        insertSize:
          type: [string, "null"]
          description: A string, not a number. Required for some library types; the client decides.
        status:
          $ref: "#/components/schemas/RunStatus"
        statusError:
          type: string
          description: Populated when `status` is `error`.
        md5VerificationStatus:
          $ref: "#/components/schemas/Md5VerificationStatus"
        md5VerificationAttempts:
          type: integer
          default: 0
        md5VerificationLastAttempt:
          type: string
          format: date-time
        md5VerificationCompletedAt:
          type: string
          format: date-time
        accessions:
          type: array
          items:
            type: string
        path:
          type: string
        rawFiles:
          type: array
          description: Virtual over `Read`. Populated by `GET /run` only.
          items:
            $ref: "#/components/schemas/Read"
        additionalFiles:
          type: array
          description: Virtual over `AdditionalFile`. Populated by `GET /run` only.
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Read:
      type: object
      description: One raw sequencing file belonging to a run.
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        run:
          $ref: "#/components/schemas/ObjectId"
        file:
          description: The `File` document, populated on `GET /run`.
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - $ref: "#/components/schemas/File"
        MD5:
          type: string
          description: The checksum supplied by the uploader.
        destinationMd5:
          type: string
          description: Recomputed after the file reached the datastore.
        md5Mismatch:
          type: [boolean, "null"]
          default: null
          description: "`null` = not yet checked, `true` = mismatch, `false` = verified equal."
        MD5LastChecked:
          type: string
          format: date-time
        paired:
          type: boolean
        sibling:
          $ref: "#/components/schemas/ObjectId"
        indexed:
          type: boolean
          default: false
          description: |
            Marks this read as an index file. Distinct from
            `LibraryType.indexed`, which describes the library type rather than
            an individual file; nothing keeps the two in step.

    File:
      type: object
      description: |
        A file on disk. An in-progress copy is written to a `.part-` sibling
        and renamed into place, so an abrupt kill never leaves a partial file
        under its real name; the API ignores `.part-` files when reconciling a
        directory.
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        type:
          type: string
        uploadName:
          type: string
        originalName:
          type: string
          description: The filename expected on disk; what directory reconciliation compares against.
        description:
          type: string
        path:
          type: string
          description: Datastore-relative once the file has been moved into place.
        uploadMethod:
          type: string
        tempUploadPath:
          type: string
          description: Set only for local-filesystem uploads.

    Option:
      type: object
      description: A controlled-vocabulary entry. `LibrarySelection`, `LibrarySource`, `LibraryStrategy` and `SequencingTechnology` share this shape.
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        value:
          type: string

    LibraryType:
      type: object
      description: A library type. The only option collection with fields beyond `value`.
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        value:
          type: string
        paired:
          type: boolean
        extensions:
          type: array
          items:
            type: string
        indexed:
          type: boolean
          default: false
          description: |
            Whether reads of this library type carry an index file.

            Two caveats for consumers. It cannot be set through
            `POST /options/librarytype` — the handler maps only `value`,
            `paired` and `extensions`, so a new document always starts
            `false`, and the flag can currently only be set directly in
            MongoDB. And because the schema defaults it to `false`, documents
            written before the field existed report `false` rather than
            absent, so "not indexed" and "unknown" are indistinguishable.

    FileReconciliation:
      type: object
      description: |
        The result of comparing a record's file documents against the files
        actually on disk, returned by `GET /project`, `GET /sample` and
        `GET /run`.

        Comparison is by COUNT per filename, not by set membership, so two
        records named `report.pdf` with one copy on disk is reported as
        missing one. Names are compared after NFC normalisation, because macOS
        and Linux disagree on how accented filenames are encoded.
      properties:
        status:
          type: string
          enum: [OK, WARNING, MISMATCH, UNKNOWN, NOT_APPLICABLE]
          description: |
            `MISMATCH` — files are missing from disk, or a record's filename
            could not be resolved. `WARNING` — only untracked extra files on
            disk. `UNKNOWN` — the directory could not be read at all; the
            request still succeeds rather than 500-ing on an unmounted
            datastore. `NOT_APPLICABLE` means the project has left live HPC
            storage, so no filesystem check was attempted.
        reason:
          type: string
          description: "PROJECT_STORAGE_READ_ONLY for NOT_APPLICABLE."
        storageState:
          type: string
          description: Project storage state for `NOT_APPLICABLE`.
        message:
          type: string
          description: A human-readable summary. A file both missing and extra is reported as a probable rename.
        missing:
          type: array
          description: Named by a record but absent from disk. Repeated by the shortfall.
          items:
            type: string
        extra:
          type: array
          description: Present on disk but not in any record. Hidden files and in-flight `.part-` copies are excluded.
          items:
            type: string
        unresolved:
          type: array
          description: |
            Ids of records whose filename could not be determined — usually an
            unpopulated ref, or a `File` deleted out from under its
            `AdditionalFile`.
          items:
            type: string
